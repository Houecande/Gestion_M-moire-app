<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Connexion - UATM Mémoires</title>
 <link rel="stylesheet" href="css/global.css"/>
 <link rel="stylesheet" href="css/components.css"/>
 <link rel="stylesheet" href="css/pages/login.css"/>
</head>
<body>
 <div class="login-page">
 <!-- Panneau gauche décoratif -->
 <div class="login-left">
 <div class="login-left-content">
 <img src="assets/logo.png" alt="Logo UATM" class="login-logo"/>
 <h1>UATM</h1>
 <p>Système de Gestion<br/>des Mémoires Soutenus</p>
 <div class="login-divider"></div>
 <ul class="login-features">
 <li>Consultez les mémoires</li>
 <li>Soumettez vos travaux</li>
 <li>Validez la conformité</li>
 <li>Suivez les notifications</li>
 </ul>
 </div>
 </div>
 <!-- Panneau droit : formulaire -->
 <div class="login-right">
 <div class="login-box">
 <h2>Connexion</h2>
 <p class="login-subtitle">Accédez à votre espace personnel</p>
 <form action="pages/etudiant/dashboard.html">
 <div class="form-group">
 <label class="form-label" for="email">Adresse e-mail</label>
 <input class="form-control" type="email" id="email" placeholder="exemple@uatm.edu" required/>
 </div>
 <div class="form-group">
 <label class="form-label" for="password">Mot de passe</label>
 <div style="position:relative">
 <input class="form-control" type="password" id="password" placeholder="••••••••" required/>
 <button type="button" onclick="togglePassword(this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.2rem">👁️</button>
 </div>
 </div>
 <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
 Se connecter
 </button>
 </form>
 <p style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--gris-texte)">
 Pas encore de compte ? <a href="#" style="color:var(--bleu);font-weight:600">Contacter l'administration</a>
 </p>
 </div>
 </div>
 </div>
 <script src="js/ui.js"></script>
</body>
</html>
