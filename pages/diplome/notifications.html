<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Notifications UATM</title>
 <link rel="stylesheet" href="../../css/global.css"/>
 <link rel="stylesheet" href="../../css/components.css"/>
 <link rel="stylesheet" href="../../css/pages/dashboard.css"/>
 <style>
 .notif-item {
 display: flex; align-items: flex-start; gap: 14px;
 padding: 16px 18px;
 background: var(--blanc);
 border-radius: var(--radius);
 border: 1px solid var(--bleu-clair);
 margin-bottom: 10px;
 transition: var(--transition);
 }
 .notif-item.non-lue { border-left: 4px solid var(--bleu); background: var(--bleu-clair); }
 .notif-item.valide { border-left: 4px solid #2e7d32; }
 .notif-item.rejete { border-left: 4px solid var(--rouge); }
 .notif-icon {
 width: 44px; height: 44px; border-radius: 50%;
 display: flex; align-items: center; justify-content: center;
 font-size: 1.2rem; flex-shrink: 0;
 }
 .notif-icon.valide { background: #e6f4ea; }
 .notif-icon.rejete { background: var(--rouge-clair); }
 .notif-icon.info { background: var(--bleu-clair); }
 .notif-body { flex: 1; }
 .notif-body h4 { font-size: 0.92rem; color: var(--noir); font-weight: 600; margin-bottom: 3px; }
 .notif-body p { font-size: 0.85rem; color: var(--gris-texte); margin-bottom: 4px; }
 .notif-date { font-size: 0.75rem; color: var(--gris-texte); white-space: nowrap; margin-top: 2px; }
 .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bleu); flex-shrink: 0; margin-top: 6px; }
 .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
 .filter-tab {
 padding: 8px 18px; border-radius: 20px;
 font-size: 0.85rem; font-weight: 600; cursor: pointer;
 border: 2px solid var(--gris-moyen); background: var(--blanc);
 color: var(--gris-texte); transition: var(--transition);
 }
 .filter-tab.active { background: var(--bleu); color: var(--blanc); border-color: var(--bleu); }
 </style>
</head>
<body class="dashboard-body">
 <nav class="navbar">
 <div class="navbar-brand">
 <img src="../../assets/logo.png" alt="UATM"/>
 <div class="brand-text">UATM <span>Gestion des Mémoires</span></div>
 </div>
 <div class="navbar-user">
 <span class="badge badge-warning">Diplomé</span>
 <strong class="user-name" id="user-name"></strong>
 </div>
 </nav>
 <div class="layout-with-sidebar">
 <aside class="sidebar">
 <div class="sidebar-section-title">Navigation</div>
 <a href="dashboard.html"> Tableau de bord</a>
 <a href="soumettre-memoire.html"> Soumettre un mémoire</a>
 <a href="notifications.html" class="active"> Notifications</a>
 <div class="sidebar-section-title">Bibliothèque</div>
 <a href="../../pages/etudiant/recherche.html"> Rechercher</a>
 <a href="../../pages/etudiant/consulter-memoire.html"> Consulter</a>
 <div class="sidebar-logout">
 <button onclick="Auth.logout()"> Déconnexion</button>
 </div>
 </aside>
 <main class="main-content">
 <div class="page-header flex-between" style="align-items:flex-start">
 <div>
 <h1> Mes notifications</h1>
 <p>Suivez l'état de vos soumissions et les alertes importantes.</p>
 </div>
 <button class="btn btn-ghost btn-sm" onclick="marquerToutesLues()" id="mark-btn">
 Tout marquer comme lu
 </button>
 </div>
 <!-- Filtres -->
 <div class="filter-tabs">
 <button class="filter-tab active" onclick="filtrer('toutes', this)">Toutes <span id="count-toutes" class="badge badge-info" style="margin-left:4px"></span></button>
 <button class="filter-tab" onclick="filtrer('non-lue', this)">Non lues <span id="count-nonlues" class="badge badge-info" style="margin-left:4px"></span></button>
 <button class="filter-tab" onclick="filtrer('valide', this)">Validations </button>
 <button class="filter-tab" onclick="filtrer('rejete', this)">Rejets </button>
 </div>
 <!-- Liste -->
 <div id="notif-list">
 <p style="text-align:center;padding:40px;color:var(--gris-texte)">Chargement</p>
 </div>
 </main>
 </div>
 <footer class="footer"> 2025 <span>UATM</span> Système de Gestion des Mémoires</footer>
 <script src="../../js/auth.js"></script>
 <script src="../../js/router.js"></script>
 <script>
 Router.guard('diplome');
 const user = Auth.getUser();
 if (user) document.getElementById('user-name').textContent = user.nom || user.email;
 
 let allNotifs = [
 { id: 1, type: 'valide', titre: 'Mémoire Validé', message: 'Félicitations ! Votre mémoire a été validé par le professeur.', memoire_titre: 'Optimisation des processus logistiques', date: 'Hier, 14:30', lu: false },
 { id: 2, type: 'info', titre: 'Nouvelle Ressource', message: 'Un nouveau guide de rédaction est disponible pour tous les étudiants.', date: 'Il y a 2 jours', lu: true },
 { id: 3, type: 'rejete', titre: 'Correction Requise', message: 'Veuillez revoir la section méthodologie de votre soumission.', memoire_titre: 'Analyse de la cybersécurité', date: 'Il y a 3 jours', lu: false }
 ];
 
 let filtreActif = 'toutes';
 const icons = { valide: '✅', rejete: '❌', info: 'ℹ️', soumission: '📄' };
 const typeClass = { valide: 'valide', rejete: 'rejete', info: 'info', soumission: 'info' };
 
 function loadNotifications() {
 document.getElementById('count-toutes').textContent = allNotifs.length;
 document.getElementById('count-nonlues').textContent = allNotifs.filter(n => !n.lu).length;
 renderNotifs(allNotifs);
 }
 
 function renderNotifs(notifs) {
 const list = document.getElementById('notif-list');
 if (!notifs.length) {
 list.innerHTML = '<div class="alert alert-info">Aucune notification dans cette catégorie.</div>';
 return;
 }
 list.innerHTML = notifs.map(n => `
 <div class="notif-item ${!n.lu ? 'non-lue' : ''} ${typeClass[n.type] || ''}">
 <div class="notif-icon ${typeClass[n.type] || 'info'}">${icons[n.type] || ''}</div>
 <div class="notif-body">
 <h4>${n.titre}</h4>
 <p>${n.message}</p>
 ${n.memoire_titre ? `<span class="badge badge-info" style="font-size:0.75rem"> ${n.memoire_titre}</span>` : ''}
 </div>
 <div style="text-align:right;flex-shrink:0">
 <div class="notif-date">${n.date}</div>
 ${!n.lu ? '<div class="notif-dot" style="margin:6px 0 0 auto"></div>' : ''}
 </div>
 </div>
 `).join('');
 }
 
 function filtrer(type, btn) {
 filtreActif = type;
 document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
 btn.classList.add('active');
 let filtered = allNotifs;
 if (type === 'non-lue') filtered = allNotifs.filter(n => !n.lu);
 else if (type !== 'toutes') filtered = allNotifs.filter(n => n.type === type);
 renderNotifs(filtered);
 }
 
 function marquerToutesLues() {
 allNotifs = allNotifs.map(n => ({ ...n, lu: true }));
 document.getElementById('count-nonlues').textContent = '0';
 renderNotifs(filtreActif === 'toutes' ? allNotifs : allNotifs.filter(n => {
 if (filtreActif === 'non-lue') return false;
 return n.type === filtreActif;
 }));
 }
 
 loadNotifications();
 </script>
</body>
</html>
