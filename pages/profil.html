<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Mon profil UATM</title>
 <link rel="stylesheet" href="../css/global.css"/>
 <link rel="stylesheet" href="../css/components.css"/>
 <link rel="stylesheet" href="../css/pages/dashboard.css"/>
 <style>
 .avatar {
 width: 88px; height: 88px; border-radius: 50%;
 background: linear-gradient(135deg, var(--bleu), var(--bleu-fonce));
 display: flex; align-items: center; justify-content: center;
 font-size: 2rem; color: var(--blanc); font-family: var(--font-titre);
 font-weight: 700; flex-shrink: 0;
 box-shadow: 0 4px 16px rgba(26,77,179,0.3);
 }
 .profil-header {
 display: flex; align-items: center; gap: 24px;
 background: var(--blanc); border-radius: var(--radius-lg);
 padding: 28px; box-shadow: var(--ombre);
 border: 1px solid var(--bleu-clair); margin-bottom: 24px;
 }
 .profil-info h2 { font-size: 1.4rem; margin-bottom: 4px; }
 .profil-info p { color: var(--gris-texte); font-size: 0.9rem; }
 .profil-info .meta { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
 .password-strength {
 height: 6px; border-radius: 3px; margin-top: 6px;
 background: var(--gris-moyen); overflow: hidden;
 }
 .password-strength-fill {
 height: 100%; border-radius: 3px; transition: all 0.3s;
 width: 0%;
 }
 .strength-label { font-size: 0.75rem; margin-top: 3px; font-weight: 600; }
 </style>
</head>
<body class="dashboard-body">
 <nav class="navbar">
 <div class="navbar-brand">
 <img src="../assets/logo.png" alt="UATM"/>
 <div class="brand-text">UATM <span>Gestion des Mémoires</span></div>
 </div>
 <div class="navbar-user">
 <span class="badge badge-info">Utilisateur</span>
 <strong class="user-name">Mon Profil</strong>
 </div>
 </nav>
 <div class="layout-with-sidebar">
 <aside class="sidebar" id="sidebar">
 <div class="sidebar-section-title">Navigation</div>
 <a href="etudiant/dashboard.html"> Tableau de bord</a>
 <a href="etudiant/recherche.html"> Rechercher</a>
 <a href="../login.html" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:20px"> Déconnexion</a>
 </aside>
 <main class="main-content">
 <!-- En-tête profil -->
 <div class="profil-header">
 <div class="avatar">U</div>
 <div class="profil-info">
 <h2>Utilisateur</h2>
 <p>email@uatm.edu</p>
 </div>
 </div>
 <div class="grid-2" style="align-items:start">
 <!-- Modifier informations -->
 <div class="card">
 <div class="card-header">
 <h3 class="card-title"> Mes informations</h3>
 </div>
 <form action="profil.html">
 <div class="grid-2" style="gap:12px">
 <div class="form-group">
 <label class="form-label">Prénom</label>
 <input class="form-control" type="text" placeholder="Prénom" required/>
 </div>
 <div class="form-group">
 <label class="form-label">Nom</label>
 <input class="form-control" type="text" placeholder="Nom" required/>
 </div>
 </div>
 <div class="form-group">
 <label class="form-label">Email</label>
 <input class="form-control" type="email" placeholder="Email" required/>
 </div>
 <button type="submit" class="btn btn-primary">
 Enregistrer les modifications
 </button>
 </form>
 </div>
 </div>
 </main>
 </div>
 <footer class="footer"> © 2026 <span>UATM</span> — Système de Gestion des Mémoires</footer>
 <script src="../js/ui.js"></script>
</body>
</html>
